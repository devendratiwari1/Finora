<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finora Account</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body class="auth-page"><header class="nav"><a class="brand" href="index.html"><span class="brand-mark">F</span>Finora</a><a class="btn ghost small" href="index.html">← Home</a></header><main class="auth-wrap"><div class="auth-card glass"><span class="eyebrow">YOUR FINORA ACCOUNT</span><h1>Welcome to your <span>financial workspace.</span></h1><div class="tabs"><button class="tab active" data-mode="login">Sign in</button><button class="tab" data-mode="signup">Create account</button></div><form id="authForm"><label>Email<input id="email" type="email" required placeholder="you@example.com"></label><label>Password<input id="password" type="password" minlength="8" required placeholder="Minimum 8 characters"></label><button class="btn" type="submit" id="authSubmit">Sign in →</button></form><p id="authStatus" class="status"></p><p class="muted tiny">Accounts are secured using Supabase Auth when you connect your project. Passwords are not stored by Finora itself.</p></div></main><script src="auth.js"></script></body></html>
